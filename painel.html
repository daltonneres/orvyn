<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel – Orvyn</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1C1338">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="painel.css">
</head>
<body>

<!-- LOGIN -->
<div id="lockScreen" class="lock-screen">
  <div class="lock-card">
    <img class="lock-logo" src="favicon.svg" alt="Orvyn">
    <h1 class="lock-title">Painel Orvyn</h1>
    <p class="lock-sub">Entre com o e-mail e a senha da equipe.</p>
    <form id="lockForm">
      <input type="email" id="lockEmail" class="input" placeholder="E-mail" autocomplete="email" required>
      <input type="password" id="lockPassword" class="input" placeholder="Senha" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary btn-block" id="lockSubmit">Entrar</button>
    </form>
    <button type="button" class="lock-link" id="lockForgot">Esqueci minha senha</button>
    <a class="lock-link" href="/">Voltar ao site</a>
    <p class="lock-error hidden" id="lockError" role="alert"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <img class="brand-logo" src="favicon.svg" alt="">
        <div><div class="brand-name">Orvyn</div><div class="brand-sub" id="userMail"></div></div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema" title="Alternar modo claro/escuro">🌙</button>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menu"><span class="nav-toggle-icon"></span></button>
    </div>
    <div class="sidebar-menu" id="sidebarMenu">
      <nav class="nav">
        <button class="nav-btn active" data-view="inicio"><span class="ico">🏠</span>Início</button>
        <button class="nav-btn" data-view="leads"><span class="ico">📥</span>Leads <span class="count hidden" id="newCount">0</span></button>
        <button class="nav-btn" data-view="clientes"><span class="ico">👥</span>Clientes</button>
        <button class="nav-btn" data-view="projetos"><span class="ico">🗂️</span>Projetos</button>
        <button class="nav-btn" data-view="portfolio"><span class="ico">🖼️</span>Portfólio</button>
        <button class="nav-btn" data-view="feedbacks"><span class="ico">⭐</span>Feedbacks</button>
        <button class="nav-btn" data-view="financeiro"><span class="ico">💰</span>Financeiro</button>
        <button class="nav-btn" data-view="agenda"><span class="ico">📅</span>Agenda</button>
      </nav>
      <a class="site-btn" href="/" target="_blank" rel="noopener"><span aria-hidden="true">↗</span> Ver o site</a>
      <button class="btn-logout" id="btnLogout">Sair</button>
    </div>
  </aside>
  <div class="content"><div class="topbar"><input id="q" class="input search" type="search" placeholder="Buscar clientes, projetos, leads, feedbacks…" aria-label="Buscar no painel"></div><main id="main" class="main"></main></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="painel-dados.js"></script>
<script src="painel.js"></script>
</body>
</html>
